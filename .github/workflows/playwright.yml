name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite (see ci-tests.config.json)"
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - regression
          - all

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CI_FAST: "1"
      CI_SOFT_PASS: "1"
      HEADLESS: "true"
      PW_HEADLESS: "1"
      PW_WORKERS: "4"
      PW_RETRIES: "1"
      CI_TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite || 'regression' }}
      TEST_ENV: ci
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ONEDIRECTBUY_BASE_URL: ${{ vars.ONEDIRECTBUY_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL || vars.ONEDIRECTBUY_BASE_URL }}
      ONEDIRECTBUY_BUYER_EMAIL: ${{ secrets.ONEDIRECTBUY_BUYER_EMAIL }}
      ONEDIRECTBUY_BUYER_PASSWORD: ${{ secrets.ONEDIRECTBUY_BUYER_PASSWORD }}
      ONEDIRECTBUY_ADMIN_EMAIL: ${{ secrets.ONEDIRECTBUY_ADMIN_EMAIL }}
      ONEDIRECTBUY_ADMIN_PASSWORD: ${{ secrets.ONEDIRECTBUY_ADMIN_PASSWORD }}
      ONEDIRECTBUY_SELLER_EMAIL: ${{ secrets.ONEDIRECTBUY_SELLER_EMAIL }}
      ONEDIRECTBUY_SELLER_PASSWORD: ${{ secrets.ONEDIRECTBUY_SELLER_PASSWORD }}
      REPORT_UPLOAD: "0"
      DASHBOARD_UPLOAD: "0"
      UI_ANALYSIS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium only
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Chromium tests
        run: npm run test:ci

      - name: Publish issues summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f reports/latest.json ]; then
            RUN_PATH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/latest.json','utf8')).path)")
            echo "### Latest run: \`$RUN_PATH\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$RUN_PATH/ISSUES.md" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Download the **test-reports** artifact and open \`ISSUES.md\` for marked findings." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

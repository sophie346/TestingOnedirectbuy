name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite (see ci-tests.config.json)"
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - regression
          - all
      workers:
        description: "Playwright worker count"
        required: false
        default: "2"

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      CI: "true"
      HEADLESS: "true"
      PW_HEADLESS: "1"
      PW_WORKERS: ${{ github.event.inputs.workers || '2' }}
      CI_TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite || 'regression' }}
      TEST_ENV: ci
      ONEDIRECTBUY_BASE_URL: ${{ vars.ONEDIRECTBUY_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL || vars.ONEDIRECTBUY_BASE_URL }}
      ONEDIRECTBUY_BUYER_EMAIL: ${{ secrets.ONEDIRECTBUY_BUYER_EMAIL }}
      ONEDIRECTBUY_BUYER_PASSWORD: ${{ secrets.ONEDIRECTBUY_BUYER_PASSWORD }}
      ONEDIRECTBUY_ADMIN_EMAIL: ${{ secrets.ONEDIRECTBUY_ADMIN_EMAIL }}
      ONEDIRECTBUY_ADMIN_PASSWORD: ${{ secrets.ONEDIRECTBUY_ADMIN_PASSWORD }}
      ONEDIRECTBUY_SELLER_EMAIL: ${{ secrets.ONEDIRECTBUY_SELLER_EMAIL }}
      ONEDIRECTBUY_SELLER_PASSWORD: ${{ secrets.ONEDIRECTBUY_SELLER_PASSWORD }}
      REPORT_UPLOAD: "0"
      REPORT_UPLOAD_URL: ${{ secrets.REPORT_UPLOAD_URL }}
      REPORT_UPLOAD_AUTH_TOKEN: ${{ secrets.REPORT_UPLOAD_AUTH_TOKEN }}
      REPORT_API_URL: ${{ secrets.REPORT_API_URL }}
      API_URL: ${{ secrets.REPORT_API_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      DASHBOARD_UPLOAD: "0"
      UI_ANALYSIS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests from ci-tests.config.json
        run: npm run test:ci

      - name: Verify reports folder
        if: ${{ !cancelled() }}
        run: |
          ls -la reports/ || true
          ls -la reports/*/summary.json || true
          test -f reports/latest.json && echo "Latest run pointer OK" || echo "latest.json missing"

      - name: Upload reports folder
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            test-results/**/*.png
            test-results/**/screenshots/**
            reports/**/html/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: |
            test-results/**/*.webm
            test-results/**/*.mp4
            test-results/**/video*
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/**/trace.zip
            test-results/**/*trace*
          retention-days: 14
          if-no-files-found: ignore

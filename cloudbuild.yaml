# CI/CD for OneDirectBuy flow control → GKE deployment `onetest`.
# Triggers: push to cicd-dev / cicd-prod (Cloud Build → this config).
#
# Local:
#   gcloud builds submit --config=cloudbuild.yaml --project=gentle-epoch-277301 .
#
# Image: gcr.io/gentle-epoch-277301/onetest:latest
# Cluster: oneautobackend (us-east1-b), namespace default
# UI:      https://onetest.onechanneladmin.com
# Backend: https://dev-onetest.onechanneladmin.com

substitutions:
  _GKE_CLUSTER: oneautobackend
  _GKE_LOCATION: us-east1-b
  _K8S_NAMESPACE: default
  _DEPLOYMENT: onetest
  _IMAGE_NAME: onetest
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="gcr.io/${PROJECT_ID}/${_IMAGE_NAME}"
        docker pull "$$IMAGE:${_TAG}" || true
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$IMAGE:${_TAG}" \
          -t "$$IMAGE:${_TAG}" \
          -t "$$IMAGE:${BUILD_ID}" \
          -f Dockerfile \
          .
        docker push "$$IMAGE:${_TAG}"
        docker push "$$IMAGE:${BUILD_ID}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud container clusters get-credentials "${_GKE_CLUSTER}" \
          --location="${_GKE_LOCATION}" \
          --project="${PROJECT_ID}"
        kubectl rollout restart deployment "${_DEPLOYMENT}" -n "${_K8S_NAMESPACE}"
        # NEG / LB readiness can take several minutes after the container is Ready.
        if ! kubectl rollout status "deployment/${_DEPLOYMENT}" -n "${_K8S_NAMESPACE}" --timeout=600s; then
          echo "WARNING: rollout status timed out; checking pods (image may still be live)"
          kubectl get pods -l "app=${_DEPLOYMENT}" -o wide || true
          kubectl describe deploy "${_DEPLOYMENT}" -n "${_K8S_NAMESPACE}" | tail -40 || true
          exit 1
        fi

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 3600s

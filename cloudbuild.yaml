# Build & push onetest image to GCR.
# From D:\TestingOnedirectbuy:
#   gcloud builds submit --config=cloudbuild.yaml --project=gentle-epoch-277301 .
#
# Then roll the cluster:
#   kubectl apply -f <onechanneladmin-latest>/deploymentsAll/ui/deployment-onetest.yaml
#   kubectl rollout restart deployment/onetest
substitutions:
  _IMAGE: gcr.io/gentle-epoch-277301/onetest
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}:${_TAG}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}:$BUILD_ID

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:$BUILD_ID

timeout: 1800s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
